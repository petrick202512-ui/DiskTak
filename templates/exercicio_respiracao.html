{% extends 'base.html' %}

{% block extra_css %}
<style>
    * {
        --cream: #F5EFE0;
        --light-green: #8EE4AF;
        --soft-green: #6DBAA8;
        --teal: #2a6b6b;
        --petroleum: #0f3a3a;
        --primary-dark: #0B1520;
    }

    .breathing-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, var(--primary-dark) 0%, var(--petroleum) 100%);
        padding: 20px;
        position: relative;
        overflow: hidden;
    }

    .breathing-top-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        z-index: 50;
    }

    .breathing-close {
        background: rgba(109, 186, 171, 0.1);
        border: 1px solid var(--soft-green);
        color: var(--soft-green);
        border-radius: 50%;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1.5rem;
        transition: all 0.3s ease;
    }

    .breathing-close:hover {
        background: rgba(109, 186, 171, 0.2);
        transform: scale(1.1);
    }

    .breathing-timer {
        font-size: 1.8rem;
        color: var(--light-green);
        font-weight: 700;
        font-family: 'Courier New', monospace;
        text-shadow: 0 0 20px rgba(142, 228, 175, 0.3);
    }

    .breathing-header {
        text-align: center;
        margin-bottom: 20px;
        margin-top: 20px;
    }

    .breathing-header h1 {
        font-size: 2.5rem;
        color: var(--light-green);
        margin-bottom: 10px;
        font-weight: 700;
        text-shadow: 0 0 25px rgba(142, 228, 175, 0.3);
    }

    .breathing-header p {
        color: var(--soft-green);
        font-size: 1rem;
        opacity: 0.9;
        letter-spacing: 0.5px;
    }

    /* 3D Character Container */
    .breathing-character-3d {
        perspective: 1000px;
        width: 280px;
        height: 280px;
        margin: 0 auto 15px;
        position: relative;
    }

    .character-wrapper {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: character-rotate 8s infinite ease-in-out;
    }

    @keyframes character-rotate {
        0%, 100% { transform: rotateY(0deg); }
        50% { transform: rotateY(5deg); }
    }

    /* Cabeça 3D */
    .head-3d {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, var(--light-green) 0%, var(--soft-green) 100%);
        border-radius: 50%;
        margin: 0 auto 15px;
        position: relative;
        box-shadow: 
            0 0 40px rgba(142, 228, 175, 0.5),
            inset -20px -20px 30px rgba(0, 0, 0, 0.3),
            inset 20px 20px 30px rgba(255, 255, 255, 0.1);
        animation: head-breath 4s infinite ease-in-out;
    }

    @keyframes head-breath {
        0%, 100% { 
            transform: scale(1);
            box-shadow: 0 0 40px rgba(142, 228, 175, 0.5), inset -20px -20px 30px rgba(0, 0, 0, 0.3), inset 20px 20px 30px rgba(255, 255, 255, 0.1);
        }
        25% { 
            transform: scale(1.18);
            box-shadow: 0 0 60px rgba(142, 228, 175, 0.8), inset -20px -20px 30px rgba(0, 0, 0, 0.3), inset 20px 20px 30px rgba(255, 255, 255, 0.1);
        }
        50% { 
            transform: scale(1);
            box-shadow: 0 0 40px rgba(142, 228, 175, 0.5), inset -20px -20px 30px rgba(0, 0, 0, 0.3), inset 20px 20px 30px rgba(255, 255, 255, 0.1);
        }
        75% { 
            transform: scale(1.12);
            box-shadow: 0 0 50px rgba(142, 228, 175, 0.6), inset -20px -20px 30px rgba(0, 0, 0, 0.3), inset 20px 20px 30px rgba(255, 255, 255, 0.1);
        }
    }

    .eyes-3d {
        position: absolute;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 25px;
        width: 100%;
        justify-content: center;
    }

    .eye-3d {
        width: 14px;
        height: 14px;
        background: var(--primary-dark);
        border-radius: 50%;
        box-shadow: 
            inset -3px -3px 5px rgba(0, 0, 0, 0.5),
            0 2px 4px rgba(0, 0, 0, 0.3);
        animation: blink-3d 4s infinite ease-in-out;
    }

    @keyframes blink-3d {
        0%, 10%, 50%, 60%, 100% { transform: scaleY(1); }
        12%, 58% { transform: scaleY(0.05); }
    }

    .mouth-3d {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 25px;
        height: 12px;
        border: 2.5px solid var(--primary-dark);
        border-top: none;
        border-radius: 0 0 25px 25px;
        animation: smile-3d 4s infinite ease-in-out;
    }

    @keyframes smile-3d {
        0%, 100% { transform: translateX(-50%) scaleY(1); }
        50% { transform: translateX(-50%) scaleY(1.3); }
    }

    /* Corpo 3D */
    .body-3d {
        display: none;
    }

    /* Braços 3D */
    .arms-3d {
        display: none;
    }

    /* Fase de Respiração */
    .breathing-phase {
        font-size: 3rem;
        color: var(--light-green);
        margin: 10px 0;
        font-weight: 700;
        text-shadow: 0 0 25px rgba(142, 228, 175, 0.4);
        min-height: 70px;
        animation: phase-fade 4s infinite ease-in-out;
        letter-spacing: 2px;
    }

    @keyframes phase-fade {
        0% { opacity: 0.7; }
        25% { opacity: 1; }
        50% { opacity: 1; }
        75% { opacity: 0.8; }
        100% { opacity: 0.7; }
    }

    .breathing-instruction {
        text-align: center;
        font-size: 1.1rem;
        color: var(--soft-green);
        opacity: 0.85;
        margin: 5px 0 15px;
        letter-spacing: 0.3px;
    }

    /* Barra de Progresso */
    .breathing-progress {
        width: 100%;
        max-width: 350px;
        height: 5px;
        background: rgba(109, 186, 171, 0.15);
        border-radius: 10px;
        margin: 15px auto;
        overflow: hidden;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--light-green) 0%, var(--soft-green) 100%);
        border-radius: 10px;
        animation: progress-fill 180s linear forwards;
        box-shadow: 0 0 15px rgba(142, 228, 175, 0.6);
    }

    @keyframes progress-fill {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    /* Estatísticas */
    .breathing-stats {
        display: none;
    }

    .stat {
        display: none;
    }

    .stat-value {
        display: none;
    }

    .stat-label {
        display: none;
    }

    /* Mensagem de Conclusão */
    .end-message {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(150px);
        background: linear-gradient(135deg, rgba(142, 228, 175, 0.15) 0%, rgba(109, 186, 171, 0.1) 100%);
        border: 2px solid var(--light-green);
        color: var(--light-green);
        padding: 25px 50px;
        border-radius: 20px;
        text-align: center;
        font-weight: 600;
        font-size: 1.1rem;
        opacity: 0;
        pointer-events: none;
        transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 100;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .end-message.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 768px) {
        .breathing-header h1 {
            font-size: 2rem;
        }

        .breathing-phase {
            font-size: 2.2rem;
        }

        .breathing-stats {
            gap: 30px;
        }

        .breathing-timer {
            font-size: 1.5rem;
        }

        .head-3d {
            width: 80px;
            height: 80px;
        }

        .body-3d {
            width: 60px;
            height: 90px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="breathing-container">
    <!-- Top Bar -->
    <div class="breathing-top-bar">
        <div class="breathing-close" onclick="window.location.href='/recursos'">
            <i class="fa-solid fa-times"></i>
        </div>
        <div class="breathing-timer" id="timer">03:00</div>
    </div>

    <!-- Header -->
    <div class="breathing-header">
        <h1>Respiração Consciente</h1>
        <p>Siga o ritmo • 3 minutos de relaxamento guiado</p>
    </div>

    <!-- 3D Character -->
    <div class="breathing-character-3d">
        <div class="character-wrapper">
            <!-- Cabeça -->
            <div class="head-3d">
                <div class="eyes-3d">
                    <div class="eye-3d"></div>
                    <div class="eye-3d"></div>
                </div>
                <div class="mouth-3d"></div>
            </div>

            <!-- Corpo -->
            <div class="body-3d"></div>

            <!-- Braços -->
            <div class="arms-3d">
                <div class="arm-3d"></div>
                <div class="arm-3d"></div>
            </div>
        </div>
    </div>

    <!-- Fase de Respiração -->
    <div class="breathing-phase" id="phase">Inspire</div>
    <div class="breathing-instruction" id="instruction">Inspire profundamente pela nasina</div>

    <!-- Barra de Progresso -->
    <div class="breathing-progress">
        <div class="progress-bar"></div>
    </div>

    <!-- Mensagem de Conclusão -->
    <div class="end-message" id="endMessage">
        ✨ Exercício Concluído! Você está mais relaxado(a) agora 🧘‍♂️
    </div>
</div>

<script>
    class BreathingExercise {
        constructor() {
            this.startTime = Date.now();
            this.exerciseDuration = 3 * 60 * 1000; // 3 minutos
            this.phaseDuration = 4000; // 4 segundos por fase
            
            this.phases = [
                { name: 'Inspire', instruction: 'Inspire profundamente pela nariz' },
                { name: 'Prenda', instruction: 'Retenha o ar nos pulmões' },
                { name: 'Expire', instruction: 'Expire lentamente pela boca' },
                { name: 'Espere', instruction: 'Pausa antes do próximo ciclo' }
            ];

            this.init();
        }

        init() {
            this.updateUI();
            this.timerInterval = setInterval(() => this.updateUI(), 100);
        }

        updateUI() {
            const elapsed = Date.now() - this.startTime;
            const remaining = Math.max(0, this.exerciseDuration - elapsed);
            
            // Atualizar cronômetro
            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            document.getElementById('timer').textContent = 
                String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');

            // Atualizar fase de respiração
            const phaseIndex = Math.floor((elapsed / this.phaseDuration) % 4);
            const currentPhase = this.phases[phaseIndex];
            document.getElementById('phase').textContent = currentPhase.name;
            document.getElementById('instruction').textContent = currentPhase.instruction;

            // Verificar se terminou
            if (remaining <= 0) {
                this.finishExercise();
            }
        }

        finishExercise() {
            clearInterval(this.timerInterval);

            const endMessage = document.getElementById('endMessage');
            endMessage.classList.add('show');

            setTimeout(() => {
                window.location.href = '/recursos';
            }, 3500);
        }
    }

    // Iniciar exercício quando a página carregar
    document.addEventListener('DOMContentLoaded', () => {
        new BreathingExercise();
    });
</script>
{% endblock %}
