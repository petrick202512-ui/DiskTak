{% extends 'base.html' %}

{% block extra_css %}
<style>
    .error-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        background: var(--grad-main);
    }

    .error-code {
        font-size: 8rem;
        font-weight: 800;
        color: #e74c3c;
        margin-bottom: 10px;
        opacity: 0.3;
    }

    .error-title {
        font-size: 2rem;
        color: var(--light-green);
        margin-bottom: 10px;
    }

    .error-message {
        font-size: 1rem;
        opacity: 0.7;
        margin-bottom: 30px;
        max-width: 300px;
    }

    .error-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
</style>
{% endblock %}

{% block content %}
<div class="error-container fade-in">
    <div class="error-code">500</div>
    <h1 class="error-title">Erro no servidor</h1>
    <p class="error-message">Oops! Algo deu errado. Nossos técnicos foram notificados e estão trabalhando nisso.</p>
    
    <div class="error-actions">
        <a href="{{ url_for('user.inicio') }}" class="btn-primary">Voltar ao início</a>
        <a href="javascript:history.back()" class="btn-secondary">Voltar</a>
    </div>
</div>
{% endblock %}
