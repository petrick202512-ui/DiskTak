{% extends 'base.html' %}

{% block extra_css %}
<style>
    .auth-wrapper {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 30px 20px;
        background: linear-gradient(135deg, var(--primary-dark) 0%, var(--petroleum) 100%);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .auth-header h2 {
        font-size: 2rem;
        color: var(--light-green);
        margin-bottom: 10px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        opacity: 0.8;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-wrapper i {
        position: absolute;
        left: 15px;
        color: var(--soft-green);
    }

    .input-wrapper input {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 15px 15px 15px 45px;
        border-radius: 15px;
        color: var(--cream);
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .input-wrapper input:focus {
        outline: none;
        border-color: var(--soft-green);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 15px rgba(109, 186, 171, 0.2);
    }

    .auth-footer {
        text-align: center;
        margin-top: 30px;
        font-size: 0.9rem;
        opacity: 0.7;
    }

    .auth-footer a {
        color: var(--soft-green);
        text-decoration: none;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-header fade-in">
        <img src="{{ url_for('static', filename='img/Logo.png') }}" alt="Logo" style="width: 80px; margin-bottom: 20px;">
        <h2>Bem-vindo de volta</h2>
        <p>estamos aqui para te ouvir.</p>
    </div>

    <form class="glass-card fade-in" style="animation-delay: 0.2s;" action="{{ url_for('auth.login') }}" method="POST">
        <div class="form-group">
            <label>E-mail</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" placeholder="seu@email.com" required>
            </div>
        </div>

        <div class="form-group">
            <label>Senha</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="senha" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Entrar</button>
    </form>

    <div class="auth-footer fade-in" style="animation-delay: 0.3s;">
        <p>Não tem uma conta? <a href="{{ url_for('auth.cadastro') }}">Criar agora</a></p>
    </div>
</div>
{% endblock %}
